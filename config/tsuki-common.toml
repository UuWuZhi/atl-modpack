#General settings
[general]

	#World generation settings
	[general.worldgen]
		#Changes generate amount of Iron Sand. Increase value to gen more Iron Sand.
		# Default: 128
		# Range: 1 ~ 5120
		iron_sand_amount = 128

	#Progression settings
	[general.progression]
		#Changes the experience needed to upgrade Mythic Pickaxe. Increase value to make it harder to upgrade.
		# Default: 10000
		# Range: > 1
		mythic_pickaxe_exp_needed = 10000
		#Allows Mythic Pickaxe to upgrade Fortune or Silk Touch when it has neither enchantment.
		mythic_pickaxe_allow_basic_enchant_upgrade = true
		#Gives the Tsuki guide book to players the first time they join a world when GuideME is installed.
		give_guide_on_first_login = true

	#Magatama settings
	[general.magatama]

		#Blue Magatama settings
		[general.magatama.blue]
			#Sets the Blue Magatama health cost per weather conversion.
			# Default: 4.0
			# Range: 0.0 ~ 1024.0
			magatama_blue_health_cost = 4.0

		#Green Magatama settings
		[general.magatama.green]
			#Sets the remaining health after using the Green Magatama.
			# Default: 1.0
			# Range: 0.1 ~ 1024.0
			magatama_green_remaining_health = 1.0
			#Sets how many crop or seed drops the Green Magatama draws per use.
			# Default: 32
			# Range: 1 ~ 1024
			magatama_green_draw_count = 32
			#Sets the item tag list used by the Green Magatama reward pool.
			magatama_green_reward_tags = ["c:seeds", "c:fishes", "c:raw_meat", "c:raw_meats", "c:eggs", "c:milk", "c:vegetables", "c:fruits", "c:crops", "c:mushrooms"]

		#Orange Magatama settings
		[general.magatama.orange]
			#Sets the Orange Magatama overflow healing to absorption conversion ratio.
			# Default: 1.0
			# Range: 0.0 ~ 1024.0
			magatama_orange_absorption_ratio = 1.0
			#Sets how much health the Orange Magatama restores per 1 saturation converted.
			# Default: 0.5
			# Range: 0.0 ~ 1024.0
			magatama_orange_saturation_to_health_ratio = 0.5
			#Sets how much health the Orange Magatama restores per 1 hunger converted.
			# Default: 1.0
			# Range: 0.0 ~ 1024.0
			magatama_orange_hunger_to_health_ratio = 1.0

		#Red Magatama settings
		[general.magatama.red]
			#Sets the entity id list executed by the Red Magatama.
			magatama_red_target_entities = ["minecraft:phantom", "alexsmobs:seagull", "alexsmobs:crimson_mosquit", "naturalist:vulture", "iceandfire:if_pixie", "touhou_little_maid:fairy"]

		#White Magatama settings
		[general.magatama.white]
			#Enables the White Magatama max health penalty.
			magatama_white_enable_penalty = true
			#Sets the White Magatama target max health while the penalty is active.
			# Default: 10.0
			# Range: 1.0 ~ 1024.0
			magatama_white_penalty_health = 10.0
			#Enables the White Magatama airborne mining speed compensation.
			magatama_white_enable_mining_speed_compensation = true
			#Sets the White Magatama airborne mining speed compensation multiplier.
			# Default: 5.0
			# Range: 1.0 ~ 64.0
			magatama_white_mining_speed_compensation_multiplier = 5.0

	#Bamboo settings
	[general.bamboo]
		#Enables bamboo spreading.
		bamboo_enable_spread = true
		#Sets the bamboo spreading chance per random tick.
		# Default: 0.15
		# Range: 0.0 ~ 1.0
		bamboo_spread_chance = 0.15

	#Futon settings
	[general.futon]
		#Sets the time speed per tick while a player is resting on a futon.
		# Default: 25.0
		# Range: 0.1 ~ 1024.0
		futon_daytime_per_tick = 25.0
		#If true, futon time acceleration only works during daytime.
		futon_accelerate_only_day = true

	#Debug settings
	[general.debug]
		#Enables debug mode.
		debug_mode = false
