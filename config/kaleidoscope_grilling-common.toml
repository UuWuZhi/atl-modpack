[hot_food]
	#热食系统配置 / Hot Food System
	#【森罗厨房联动热食】允许森罗厨房的炒锅、炖锅为食物附加🔥热状态和调料效果。 / Allow Kaleidoscope Cookery pots and stockpots to provide hot-food and special seasoning effects.
	enableCookeryFoodHeatAndSeasoning = true
	#【熔炉产热食】开启后，从熔炉、烟熏炉取出的可食用成品自动获得🔥热状态。 / When enabled, edible furnace and smoker outputs become hot when taken out.
	enableSmeltedFoodHeat = false
	#【熔炉热食时长】熔炉产出食物的🔥热状态持续时间（秒）。 / Hot duration in seconds for edible furnace and smoker outputs.
	# Default: 30
	# Range: 1 ~ 86400
	smeltedFoodSeconds = 30
	#【热食饱和度倍率】食物处于🔥热状态时的饱和度倍率百分比。默认 125%，不改变饱食度。 / Saturation multiplier in percent while food is hot. Default 125%. Does not change nutrition.
	# Default: 125
	# Range: 100 ~ 200
	hotSaturationPercent = 125

[rendering]
	#渲染配置 / Rendering
	#【烤串GUI缓存】开启后以64×64高精度缓存已完成烤串的图标，降低重复模型渲染的性能开销。 / Cache completed skewer icons in GUIs to reduce repeated model rendering.
	enableSkewerGuiCache = false
